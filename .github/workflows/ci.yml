name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 포맷 확인 (실패하면 npm run format 실행 후 커밋)
        run: npm run format:check
      - run: npm test
      - run: npm run build
